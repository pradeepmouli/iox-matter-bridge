name: Validate Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to validate (bridge or tui-v...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-artifacts:
    name: Validate release integrity and TUI contents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # This checkout uses maintained scripts only when the release tag already
      # contains this workflow. Tags with older YAML need manual dispatch from
      # the default branch; checkout cannot replace their workflow definition.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize failure report
        run: |
          printf '# Release Artifact Validation\n\n**FAIL**: Metadata retrieval or artifact download did not complete. See the workflow logs.\n' > validation_report.md

      - name: Read release metadata and all asset digests
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: process.env.TAG
            });
            release.assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            fs.writeFileSync('release.json', JSON.stringify(release));

      - name: Download release artifacts
        run: |
          mkdir artifacts
          gh release download "$TAG" --repo "$REPO" --dir artifacts

      - name: Validate downloaded bytes and archive contents
        run: node .github/scripts/validate-release.cjs release.json artifacts validation_report.md

      - name: Publish validation summary
        if: always()
        run: |
          if [ -f validation_report.md ]; then
            cat validation_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.md
          retention-days: 90
