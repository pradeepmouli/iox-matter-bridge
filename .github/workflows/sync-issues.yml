name: Sync Issues to udi-js

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing issue number to sync or retry'
        required: true
        type: string

permissions:
  issues: write
  contents: read

# Serialize opened/labeled events and manual retries for the same issue.
concurrency:
  group: sync-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  sync-to-udi-js:
    name: Sync Issue to udi-js Repository
    runs-on: ubuntu-latest
    env:
      TARGET_REPO_OWNER: pradeepmouli
      TARGET_REPO_NAME: udi-js
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check current issue and target credentials
        id: check
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          UDI_JS_ISSUES_TOKEN: ${{ secrets.UDI_JS_ISSUES_TOKEN }}
        with:
          script: |
            const { prepareSync } = require('./.github/scripts/sync-issues.cjs');
            const issue = await prepareSync({
              github, context,
              issueNumber: process.env.ISSUE_NUMBER,
              token: process.env.UDI_JS_ISSUES_TOKEN,
            });
            core.setOutput('should_sync', issue !== null);
            return issue;

      - name: Copy issue to udi-js repository
        if: steps.check.outputs.should_sync == 'true'
        id: copy
        uses: actions/github-script@v7
        env:
          SOURCE_ISSUE: ${{ steps.check.outputs.result }}
        with:
          # GITHUB_TOKEN is scoped to this repository and cannot create an issue
          # in udi-js. This separately provisioned secret only needs target access.
          github-token: ${{ secrets.UDI_JS_ISSUES_TOKEN }}
          script: |
            const { copyIssue } = require('./.github/scripts/sync-issues.cjs');
            return await copyIssue({
              github, context, core,
              issue: JSON.parse(process.env.SOURCE_ISSUE),
              target: { owner: process.env.TARGET_REPO_OWNER, repo: process.env.TARGET_REPO_NAME },
            });

      - name: Link and label successfully synced source issue
        if: steps.check.outputs.should_sync == 'true' && steps.copy.outcome == 'success'
        uses: actions/github-script@v7
        env:
          SOURCE_ISSUE: ${{ steps.check.outputs.result }}
          SYNCED_ISSUE: ${{ steps.copy.outputs.result }}
        with:
          # Source comments and labels use only this repository's GITHUB_TOKEN.
          script: |
            const { markSynced } = require('./.github/scripts/sync-issues.cjs');
            await markSynced({
              github, context,
              issue: JSON.parse(process.env.SOURCE_ISSUE),
              synced: JSON.parse(process.env.SYNCED_ISSUE),
              target: { owner: process.env.TARGET_REPO_OWNER, repo: process.env.TARGET_REPO_NAME },
            });
